name: Validate source and deploy STARSHIP SABOTAGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The full Chromium multiplayer suite remains in .github/workflows/qa.yml.
# A static site release is gated by deterministic source/game-map validation;
# external browser-download delays must not prevent the game being published.
concurrency:
  group: starship-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and publish website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax, navigation and gameplay invariants
        run: node tests/validate.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
