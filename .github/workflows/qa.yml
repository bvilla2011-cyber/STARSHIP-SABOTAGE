name: STARSHIP SABOTAGE 4 · QA
on:
  push:
    branches: [development/starship-v4]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run validate
      - run: npm test
      - run: npm run test:browser
      - run: npx playwright test --config=playwright.compat.config.cjs
      - run: npx playwright test tests/v4-live.spec.cjs --config=playwright.live.config.cjs
      - run: node tools/print-qa-visuals.cjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starship-v4-browser-qa
          path: |
            playwright-report/
            test-results/
