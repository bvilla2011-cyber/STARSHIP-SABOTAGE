name: STARSHIP SABOTAGE · QA

on:
  push:
    branches:
      - development/spaceship-sabotage-rebuild
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate source and map navigation
        run: node tests/validate.js
      - name: Test two-client multiplayer flow
        run: npx playwright test tests/e2e.spec.cjs --reporter=line
